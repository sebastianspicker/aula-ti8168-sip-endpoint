[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-emulator"
version = "0.2.0"
description = "Synthetic local recording and stream state model"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aula-emulator = "aula_emulator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
