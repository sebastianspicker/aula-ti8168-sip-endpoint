[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aula-emulator"
version = "0.2.0"
description = "Synthetic local recording and stream state for development checks"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[project.scripts]
aula-emulator = "aula_emulator.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = "../../.work/cache/pytest/emulator"

[tool.setuptools.packages.find]
where = ["src"]
