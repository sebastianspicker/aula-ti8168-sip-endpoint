# This example is intentionally non-operational: it contains no endpoint,
# meeting, password, host key, authorization value, or network opt-in.
# Unknown or duplicate keys must be rejected by the strict parser.

[runtime]
foreground = true
pid_file = /run/aula-sipd.pid
# Optional persistent LSZ1 opcode-9 settings.  The daemon creates this
# owner-only file atomically; its existing parent must be daemon-owned.
settings_file = /var/lib/aula-sipd/settings.json
log_sink = syslog
log_level = info
log_summary_interval_seconds = 60

[sip]
# Fixed policy profile: zoom_direct, zoom_proxy, or private_lab.
profile = private_lab
# Set an approved endpoint only in a root-owned local configuration.
# This is the local room identity. In private_lab it also supplies the
# configured peer domain; it is never an HTTP-provided meeting dial string.
uri =
registrar_uri =
transport = udp
auth_username =
# Store a secret outside versioned configuration with mode 0600.
auth_secret_file =
# Required for TLS profiles. Provision a reviewed CA file outside releases.
tls_ca_file =
enable_tls = false
enable_public_network = false
transaction_timeout_ms = 32000
max_retransmissions = 6
max_reconnect_attempts = 3

[media]
# fixture is the only safe default before hardware discovery and authorization.
backend = fixture
video_source =
audio_source =
# RTSP ingest is pinned to this canonical numeric IPv4 target.  Leave the
# loopback default unless an authorized isolated lab explicitly changes it.
authorized_rtsp_ipv4 = 127.0.0.1
# IPv4 literals only. They must match; no NAT address translation is implicit.
bind_address = 127.0.0.1
advertised_address = 127.0.0.1
preferred_audio_codec = pcmu
# SDP media security: prefer_srtp, required, or plain_compat. zoom_direct and
# zoom_proxy require "required"; clear compatibility is allowed only for an
# explicit private_lab profile, as in this inert example.
security = plain_compat
# Native RTSP defaults to TCP interleaving. UDP is opt-in and uses only
# bounded sockets supplied by the backend after native AAC support is built.
rtsp_use_udp = false
rtsp_jitter_max_ms = 120
rtsp_reconnect_limit = 3
local_rtp_port_min = 40000
local_rtp_port_max = 40100
rtp_mtu = 1200
# The AEC seam is disabled by default.  Delay is in bounded 20 ms frames;
# set calibrated only after a measured live delay, never from host/QEMU runs.
aec_enabled = false
aec_reference_delay_frames = 0
aec_delay_calibrated = false
video_queue_frames = 8
audio_queue_frames = 10
# Used only by rtsp_gst_process.  A privileged daemon drops irrevocably to
# this non-root identity after clearing supplementary groups and before exec.
child_uid = 65534
child_gid = 65534

[control]
enable_local_control = false
unix_socket_path = /run/aula-sipd/control.sock
unix_socket_mode = 0660
# Numeric UID allocated to the unprivileged FastCGI gateway at install time.
gateway_uid = 65534

[limits]
sip_message_bytes = 16384
sdp_bytes = 8192
rtp_packet_bytes = 1500
video_access_unit_bytes = 2097152
audio_frame_bytes = 4096
control_message_bytes = 2048
log_events_per_interval = 120
