# QEMU-only profile. Never install this on an appliance or expose it on a LAN.
# The self-signed certificate must be generated and trusted explicitly by the
# developer's browser; this profile intentionally never emits HSTS.
worker_processes 1;
pid /run/aula-nginx.pid;
error_log /var/log/aula-console/nginx-error.log info;

events { worker_connections 128; }

http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/aula-console/nginx-access.log;
  client_max_body_size 2k;
  client_body_timeout 5s;
  keepalive_timeout 10s;
  limit_req_zone $binary_remote_addr zone=auth_source:10m rate=3r/m;

  server {
    listen 8443 ssl;
    server_name console.invalid;
    location = /zoom { root /var/lib/aula-console/ui; absolute_redirect off; }
    ssl_certificate /etc/aula-console/tls/server.crt;
    ssl_certificate_key /etc/aula-console/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_stapling off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /zoom/api/v1/auth/bootstrap { limit_req zone=auth_source burst=3 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_param AULA_CLIENT_ID $remote_addr; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/auth/login { limit_req zone=auth_source burst=3 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_param AULA_CLIENT_ID $remote_addr; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/auth/logout { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/auth/session { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/status { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/device/status { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/device/credentials { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/library { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/schedule { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/device/settings { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/maintenance { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/events { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls/active { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls/active/dtmf { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls/active/media { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/directory { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/media { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/media/preview { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/media/preview.flv { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_buffering off; fastcgi_request_buffering off; fastcgi_read_timeout 6m; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/settings { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/settings/credentials { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/users { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/diagnostics { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/diagnostics/metrics { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/diagnostics/tests { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    location /zoom/api/v1/diagnostics/export/ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/aula-gateway-fcgi; fastcgi_pass unix:/run/aula-console/gateway.fcgi.sock; }
    # Vite emits content-fingerprinted files only below /zoom/assets/.
    location ^~ /zoom/assets/ { root /var/lib/aula-console/ui; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; }
    location /zoom/ { root /var/lib/aula-console/ui; try_files $uri $uri/ =404; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; }
    location / { try_files /__aula_zoom_not_found__ =404; }
  }
}
