# Nginx 1.31.4 production profile.  Build only against an operator-provided,
# verified source tree; this file causes no network download.
worker_processes 1;
pid /run/ls200-nginx.pid;
error_log /var/log/ls200-console/nginx-error.log warn;

events { worker_connections 128; }

http {
  include mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/ls200-console/nginx-access.log;
  client_max_body_size 2k;
  client_body_timeout 5s;
  keepalive_timeout 10s;
  # The application also applies account, source, and global PBKDF2 budgets.
  # This edge limit keeps request floods away from FastCGI entirely.
  limit_req_zone $binary_remote_addr zone=auth_source:10m rate=3r/m;

  server {
    listen 8443 ssl;
    server_name console.invalid;
    location = /zoom { root /var/lib/ls200-console/ui; absolute_redirect off; }
    ssl_certificate /etc/ls200-console/tls/server.crt;
    ssl_certificate_key /etc/ls200-console/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_stapling off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # This is the trusted-TLS production profile, never the QEMU development profile.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Keep this an allowlist. There is no catch-all API proxy.
    location = /zoom/api/v1/auth/bootstrap { limit_req zone=auth_source burst=3 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_param LS200_CLIENT_ID $remote_addr; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/auth/login { limit_req zone=auth_source burst=3 nodelay; include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_param LS200_CLIENT_ID $remote_addr; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/auth/logout { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/auth/session { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/status { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/device/status { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/device/credentials { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/library { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/schedule { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/device/settings { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/maintenance { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/events { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls/active { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls/active/dtmf { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/calls/active/media { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/directory { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/media { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/media/preview { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/media/preview.flv { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_buffering off; fastcgi_request_buffering off; fastcgi_read_timeout 6m; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/settings { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/settings/credentials { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/users { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/diagnostics { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/diagnostics/metrics { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location = /zoom/api/v1/diagnostics/tests { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    location /zoom/api/v1/diagnostics/export/ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /usr/libexec/ls200-gateway-fcgi; fastcgi_pass unix:/run/ls200-console/gateway.fcgi.sock; }
    # add_header in a location replaces inherited headers, so repeat the full
    # browser boundary policy for UI assets under /zoom/.
    # Vite emits content-fingerprinted files only below /zoom/assets/.
    location ^~ /zoom/assets/ { root /var/lib/ls200-console/ui; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; add_header Strict-Transport-Security "max-age=31536000" always; }
    location /zoom/ { root /var/lib/ls200-console/ui; try_files $uri $uri/ =404; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always; add_header Strict-Transport-Security "max-age=31536000" always; }
    location / { try_files /__ls200_zoom_not_found__ =404; }
  }
}
